<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>論理回路まなびゲーム</title>
  <style>
    :root {
      --bg: #f6f8f4;
      --ink: #1d2a2a;
      --line: #556;
      --water: #2a7fd4;
      --dry: #b9bfc4;
      --ok: #1f9d55;
      --ng: #d64545;
      --pending: #f4b400;
      --s: 1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 16px;
      color: var(--ink);
      background: var(--bg);
    }
    [hidden] { display: none !important; }
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; }
    h1 { font-size: 20px; margin: 0; }
    #lesson { color: #556; }
    button {
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      font: inherit;
      border: 1px solid #889;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: #2a7fd4; color: #fff; border-color: #2a7fd4; }

    main { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 16px; }
    #garden-wrap {
      position: relative;
      width: 100%;
      overflow: auto;
      border-radius: 12px;
      background: linear-gradient(#e8f4df, #d4e9c4);
      touch-action: pan-x pan-y;
    }
    #garden-box { position: relative; }
    #garden {
      position: absolute;
      left: 0;
      top: 0;
      width: 900px;
      height: 520px;
      transform-origin: 0 0;
      touch-action: none;
      user-select: none;
    }
    #wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    #wires .wire { fill: none; stroke: var(--dry); stroke-width: 6; stroke-linejoin: round; }
    #wires .wire.on { stroke: var(--water); }
    #wires .wire.selected { stroke: var(--pending); }
    #wires .hit { fill: none; stroke: transparent; stroke-width: 22; pointer-events: stroke; cursor: pointer; }
    #wires .temp { fill: none; stroke: var(--pending); stroke-width: 4; stroke-dasharray: 6 6; }

    .faucet, .outlet, .part {
      position: absolute;
      width: 110px;
      height: 50px;
      padding: 4px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      line-height: 1.3;
    }
    .faucet { width: 100px; cursor: pointer; }
    .faucet.open { background: #cfe8ff; border-color: var(--water); }
    .outlet { text-align: center; }
    .outlet.ok { border-color: var(--ok); }
    .outlet.ng { border-color: var(--ng); }
    .outlet.wet { background: #cfe8ff; }
    .part { cursor: grab; touch-action: none; }
    .part span { color: #667; font-size: 12px; }

    /* ピンの見た目は 16px、触れる範囲は 44px（画面の拡大率に関係なく） */
    .pin {
      position: absolute;
      width: calc(44px / var(--s));
      height: calc(44px / var(--s));
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      touch-action: none;
      z-index: 2;
    }
    .pin::after {
      content: "";
      width: calc(16px / var(--s));
      height: calc(16px / var(--s));
      border-radius: 50%;
      background: #667;
    }
    .pin.wet::after { background: var(--water); }
    .pin.pending { outline: calc(3px / var(--s)) solid var(--pending); }

    .ghost {
      position: fixed;
      width: 110px;
      height: 50px;
      padding: 4px 8px;
      border: 2px dashed #333;
      border-radius: 10px;
      background: #fff;
      opacity: 0.85;
      pointer-events: none;
      z-index: 10;
      font-size: 14px;
    }

    #tray { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
    #tray p { margin: 0; color: #556; }
    .chip {
      flex: 0 0 auto;
      min-width: 140px;
      min-height: 56px;
      padding: 6px 10px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      touch-action: none;
      cursor: grab;
      font-size: 14px;
    }
    .chip span { display: block; color: #556; }
    .chip.empty { opacity: 0.4; }

    #toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
    #hint-text {
      margin: 0;
      padding: 8px 12px;
      white-space: pre-line;
      border-radius: 10px;
      background: #fff8d6;
    }

    #schedule-wrap h2 { font-size: 18px; margin: 0 0 8px; }
    #schedule { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
    th, td { padding: 8px; text-align: center; border-bottom: 1px solid #e3e6e1; }
    tr[data-row] { cursor: pointer; }
    tr.current { background: #fff3c4; }
    td.mark { font-size: 20px; font-weight: bold; }

    #stage-select { padding: 0 16px 16px; }
    #stage-list { list-style: none; padding: 0; display: grid; gap: 8px; }
    #stage-list button { width: 100%; text-align: left; }
    #stage-list button:disabled { color: #889; }

    #clear-dialog {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      z-index: 20;
    }
    #clear-dialog div {
      padding: 24px;
      border-radius: 14px;
      background: #fff;
      text-align: center;
      display: grid;
      gap: 12px;
    }
    #clear-stars { font-size: 32px; color: #e0a800; }

    @media (min-width: 900px) {
      main { flex-direction: row; align-items: flex-start; }
      main > section:first-child { flex: 1; min-width: 0; }
      #schedule-wrap { width: 300px; }
    }
  </style>
</head>
<body>
  <header>
    <button id="menu">ステージ</button>
    <h1 id="title"></h1>
    <span id="lesson"></span>
  </header>

  <main id="game">
    <section>
      <div id="garden-wrap">
        <div id="garden-box">
          <div id="garden"></div>
        </div>
      </div>
      <div id="toolbar">
        <button id="undo" title="元に戻す">↶ 戻す</button>
        <button id="redo" title="やり直す">↷ やり直す</button>
        <button id="delete-wire" hidden>この水路を消す</button>
        <button id="hint-button">電球（ヒント）</button>
        <button id="fit">庭全体</button>
        <button id="clear-all">全部消す</button>
        <button id="judge" class="primary">水やり開始</button>
      </div>
      <p id="hint-text" hidden></p>
      <div id="tray"></div>
    </section>
    <section id="schedule-wrap">
      <h2>今日の予定表</h2>
      <div id="schedule"></div>
    </section>
  </main>

  <section id="stage-select" hidden>
    <h2>ステージ</h2>
    <ul id="stage-list"></ul>
    <p><button id="back">もどる</button></p>
  </section>

  <div id="clear-dialog" hidden>
    <div>
      <p>水やり成功！</p>
      <p id="clear-stars"></p>
      <button id="next-stage" class="primary">次のステージ</button>
      <button id="to-menu">ステージ選びへ</button>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
